<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile layout fixture (emulated capabilities)</title>
<style>html,body{margin:0;height:100%;background:#111}iframe{display:block;width:100%;height:100%;border:0}</style>
<iframe id="fixture" title="Game with emulated coarse-pointer capabilities"></iframe>
<button id="run-checks" style="position:fixed;z-index:100;bottom:150px;left:50%;transform:translateX(-50%)">Run emulated input checks</button>
<output id="check-result" style="position:fixed;z-index:100;bottom:150px;left:12px;right:12px;background:#111;color:white"></output>
<script type="module">
  // Test-only capability emulation; production detection does not read URL flags.
  const page = new DOMParser().parseFromString(await (await fetch("../index.html")).text(), "text/html");
  const base = page.createElement("base");
  base.href = new URL("../", location.href).href;
  page.head.prepend(base);
  const setup = page.createElement("script");
  setup.textContent = `const nativeMatchMedia = window.matchMedia.bind(window);
    window.matchMedia = (query) => {
      const result = nativeMatchMedia(query);
      if (query === '(pointer: coarse)' || query === '(any-pointer: coarse)') Object.defineProperty(result, 'matches', { value: true });
      return result;
    };
    Object.defineProperty(navigator, 'maxTouchPoints', { value: 2 });`;
  base.after(setup);
  const frame = document.getElementById("fixture");
  const runButton = document.getElementById("run-checks");
  const report = document.getElementById("check-result");
  frame.onload = () => frame.contentDocument.body.append(runButton, report);
  frame.srcdoc = "<!doctype html>" + page.documentElement.outerHTML;
  runButton.onclick = () => {
    const win = document.getElementById("fixture").contentWindow;
    const game = win.snejFishing;
    const controls = game.ui.el.mobileControls;
    const stick = controls.querySelector(".mobile-stick");
    const cast = controls.querySelector("[data-mobile-cast]");
    const run = controls.querySelector("[data-mobile-run]");
    const look = controls.querySelector("[data-mobile-look]");
    const targets = [stick, look, cast, run];
    const originals = targets.map((target) => [target.setPointerCapture, target.hasPointerCapture, target.releasePointerCapture]);
    const check = (condition, message) => { if (!condition) throw new Error(message); };
    // Synthetic pointers cannot acquire native capture; emulate capture only for this fixture.
    targets.forEach((target) => {
      const held = new Set();
      target.setPointerCapture = (id) => held.add(id);
      target.hasPointerCapture = (id) => held.has(id);
      target.releasePointerCapture = (id) => held.delete(id);
    });
    const pointer = (target, type, id, x, y) => target.dispatchEvent(new win.PointerEvent(type,
      { pointerType: "touch", pointerId: id, clientX: x, clientY: y, bubbles: true, cancelable: true }));
    const before = { yaw: game.yaw, pitch: game.pitch, pos: game.pos.clone(), autoSprint: game.settings.autoSprint,
      environment: game.mobileInput.environment, touchSeen: game.mobileInput.touchSeen };
    try {
      check(game.mode === "playing" && game.mobileInput.enabled, "Enter the game first");
      game.mobileInput.setActive(true);
      // Exercise a detection miss through real DOM propagation, not only forced coarse queries.
      game.mobileInput.environment = { document: win.document, navigator: { maxTouchPoints: 5 }, matchMedia: () => ({ matches: false }) };
      game.mobileInput.touchSeen = false;
      game.mobileInput.refreshAvailability();
      check(!game.mobileInput.enabled && controls.hidden, "Detection miss not reproduced");
      pointer(game.canvas, "pointerdown", 100, 330, 180);
      check(game.mobileInput.state.look === null, "Left canvas stole camera input");
      pointer(look, "pointerdown", 100, 600, 180);
      check(game.mobileInput.enabled && !controls.hidden && game.mobileInput.state.look?.id === 100, "First touch did not recover controls");
      pointer(look, "pointercancel", 100, 600, 180);
      game.mobileInput.environment = before.environment;
      const rect = stick.getBoundingClientRect(), x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
      pointer(stick, "pointerdown", 101, x, y);
      pointer(stick, "pointermove", 101, x, y + 22);
      const lookRect = look.getBoundingClientRect(), lookX = lookRect.left + lookRect.width / 2;
      check(win.document.elementFromPoint(x, y)?.closest(".mobile-stick") === stick, "Joystick hit area is covered");
      const runRect = run.getBoundingClientRect();
      check(win.document.elementFromPoint(runRect.left + 36, runRect.top + 36) === run, "Run hit area is covered");
      check(win.document.elementFromPoint(lookX, 180) === look, "Look area is covered");
      pointer(look, "pointerdown", 102, lookX, 180);
      pointer(look, "pointermove", 102, lookX + 40, 190);
      check(game.mobileInput.state.axes.mz < 0, "Joystick not active");
      game.updateLook(1 / 60);
      check(game.yaw !== before.yaw, "Swipe did not turn camera");
      game.settings.autoSprint = false;
      pointer(run, "pointerdown", 104, runRect.left + 36, runRect.top + 36);
      check(game.mobileInput.movement().sprint, "Run button did not activate sprint");
      game.updateMove(0.1);
      check(game.pos.distanceTo(before.pos) > 0, "Joystick did not move character");
      pointer(look, "pointerup", 102, lookX + 40, 190);
      check(game.mobileInput.state.axes.mz < 0, "Look release cancelled movement");
      check(game.mobileInput.movement().sprint, "Look release cancelled Run");
      pointer(run, "pointercancel", 104, runRect.left + 36, runRect.top + 36);
      check(!game.mobileInput.movement().sprint && game.mobileInput.state.axes.mz < 0, "Run release did not preserve walking");
      pointer(stick, "pointercancel", 101, x, y);
      check(game.mobileInput.state.axes.mz === 0, "Movement cancellation stuck");
      pointer(cast, "pointerdown", 103, 770, 330);
      check(game.mobileInput.state.castId === 103, "Cast finger not captured");
      pointer(cast, "pointercancel", 103, 770, 330);
      check(game.cast.state.fs !== "flight" && game.mobileInput.state.castId === null, "Cancel released a cast");
      report.textContent = "PASS: touch detection + joystick + Run + right swipe + cancellation";
      runButton.hidden = true;
    } catch (error) {
      report.textContent = "FAIL: " + error.message;
    } finally {
      game.mobileInput.reset();
      game.mobileInput.environment = before.environment;
      game.mobileInput.touchSeen = before.touchSeen;
      game.mobileInput.refreshAvailability();
      game.pos.copy(before.pos); game.yaw = before.yaw; game.pitch = before.pitch; game.settings.autoSprint = before.autoSprint;
      targets.forEach((target, i) => ["setPointerCapture", "hasPointerCapture", "releasePointerCapture"].forEach((key, j) => { target[key] = originals[i][j]; }));
    }
  };
</script>
</html>
